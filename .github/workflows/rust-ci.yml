name: SolidCraft Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textillab:
    name: TextilLab / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: textillab

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: textillab
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Studio JavaScript syntax
        run: node --check studio/app.js
      - name: Browser demo syntax and regression tests
        run: |
          node --check ../docs/textillab/app.js
          node --check ../docs/textillab/browser-engine.js
          node --check ../docs/textillab/pattern-library.js
          node --check ../docs/textillab/bodice-v2.js
          node --test ../docs/textillab/bodice-v2.test.js
          node --test ../docs/textillab/browser-engine.test.js
          node --test ../docs/textillab/pattern-library.test.js
      - name: Unit tests
        run: cargo test --all-targets --all-features --verbose
      - name: Release build
        run: cargo build --release --all-targets
      - name: CLI smoke test
        run: cargo run --release --bin textillab-demo -- smoke-exports
      - name: OBJ import and seam split smoke test
        run: |
          cargo run --release --bin textillab-obj -- examples/bent-panel.obj --out smoke-exports/obj-import.svg
          cargo run --release --bin textillab-obj -- examples/bent-panel.obj --seam 1:3 --out smoke-exports/obj-split.svg
      - name: Clothing blocks smoke test
        run: |
          cargo run --release --bin textillab-pattern -- top chest=112 waist=92 --allowance 10 --out smoke-exports/top-block.svg
          cargo run --release --bin textillab-pattern -- trousers hip=112 inseam=82 --out smoke-exports/trousers-block.svg
          cargo run --release --bin textillab-pattern -- glove hand=23 handLength=20 --out smoke-exports/glove-block.svg
      - name: VT/RT v2 bodice SVG smoke test
        run: |
          cargo run --release --bin textillab-pattern -- top chest=108 waist=89 hip=106 frontLength=48 backWaist=44 bustHeight=28 bustSpan=20 neck=39 armholeDepth=23 --out smoke-exports/bodice-v2.svg
      - name: Check bodice features in SVG
        shell: bash
        run: |
          test -s smoke-exports/bodice-v2.svg
          grep -q 'data-bodice-version="2"' smoke-exports/bodice-v2.svg
          grep -q 'FDL' smoke-exports/bodice-v2.svg
          grep -q 'Taille' smoke-exports/bodice-v2.svg
      - name: Verify clothing SVG
        shell: bash
        run: |
          test -s smoke-exports/top-block.svg
          test -s smoke-exports/trousers-block.svg
          test -s smoke-exports/glove-block.svg
      - name: Verify OBJ exports
        shell: bash
        run: |
          test -s smoke-exports/obj-import.svg
          test -s smoke-exports/obj-split.svg
      - name: Verify exports
        shell: bash
        run: |
          test -s smoke-exports/pattern.svg
          test -s smoke-exports/pattern.obj
      - name: Upload exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textillab-exports-${{ matrix.os }}
          path: textillab/smoke-exports/
          if-no-files-found: ignore
