name: SolidCraft Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textillab:
    name: TextilLab / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: textillab

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: textillab
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Studio JavaScript syntax
        run: node --check studio/app.js
      - name: Browser demo syntax and regression tests
        run: |
          node --check ../docs/textillab/app.js
          node --check ../docs/textillab/browser-engine.js
          node --check ../docs/textillab/seam-contracts.js
          node --check ../docs/textillab/hood-system.js
          node --test ../docs/textillab/hood-system.test.js
          node --check ../docs/textillab/pants-system.js
          node --check ../docs/textillab/ruleset-registry.js
          node --test ../docs/textillab/pants-system.test.js
          node --check ../docs/textillab/pattern-library.js
          node --check ../docs/textillab/bodice-v2.js
          node --check ../docs/textillab/drafting-system.js
          node --check ../docs/textillab/studio-workspace.js
          node --test ../docs/textillab/studio-workspace.test.js
          node --test ../docs/textillab/drafting-system.test.js
          node --test ../docs/textillab/bodice-v2.test.js
          node --test ../docs/textillab/browser-engine.test.js
          node --test ../docs/textillab/pattern-library.test.js
      - name: Unit tests
        run: cargo test --all-targets --all-features --verbose
      - name: Release build
        run: cargo build --release --all-targets
      - name: CLI smoke test
        run: cargo run --release --bin textillab-demo -- smoke-exports
      - name: OBJ import and seam split smoke test
        run: |
          cargo run --release --bin textillab-obj -- examples/bent-panel.obj --out smoke-exports/obj-import.svg
          cargo run --release --bin textillab-obj -- examples/bent-panel.obj --seam 1:3 --out smoke-exports/obj-split.svg
      - name: Pants v1.1 provenance and curve smoke test
        run: |
          cargo run --release --bin textillab-pattern -- trousers hip=112 waist=90 inseam=82 outseam=110 waistToKnee=61 crotchDepth=28 thigh=66 knee=49 hem=44 --allowance 10 --out smoke-exports/pants-rules-v11.svg
      - name: Validate pants v1.1 SVG
        shell: bash
        run: |
          test -s smoke-exports/pants-rules-v11.svg
          grep -q 'data-pants-system="textillab.pants.experimental.1"' smoke-exports/pants-rules-v11.svg
          grep -q 'HH' smoke-exports/pants-rules-v11.svg
          grep -q 'FDL' smoke-exports/pants-rules-v11.svg
      - name: Parametric hood profiles and sewing seam contract smoke tests
        run: |
          cargo run --release --bin textillab-pattern -- hood --profile women head=57 backNeck=10 frontNeck=12 hoodHeight=32 hoodDepth=27 --out smoke-exports/hood-women-v13.svg
          cargo run --release --bin textillab-pattern -- hood --profile men --style relaxed head=59 backNeck=10.5 frontNeck=12.5 --out smoke-exports/hood-men-v13.svg
          cargo run --release --bin textillab-pattern -- hood --profile child ageYears=8 head=52 backNeck=8 frontNeck=9.5 --out smoke-exports/hood-child-v13.svg
      - name: Verify hood provenance, fitted seams and explicit nonapproval
        shell: bash
        run: |
          test -s smoke-exports/hood-women-v13.svg
          test -s smoke-exports/hood-men-v13.svg
          test -s smoke-exports/hood-child-v13.svg
          grep -q 'data-hood-system="textillab.hood.prototype.1"' smoke-exports/hood-women-v13.svg
          grep -q 'data-seams-ok="true"' smoke-exports/hood-women-v13.svg
          grep -q 'data-production-approved="false"' smoke-exports/hood-child-v13.svg
      - name: Clothing blocks smoke test
        run: |
          cargo run --release --bin textillab-pattern -- top chest=112 waist=92 --allowance 10 --out smoke-exports/top-block.svg
          cargo run --release --bin textillab-pattern -- trousers hip=112 inseam=82 --out smoke-exports/trousers-block.svg
          cargo run --release --bin textillab-pattern -- glove hand=23 handLength=20 --out smoke-exports/glove-block.svg
      - name: VT/RT v2 bodice SVG smoke test
        run: |
          cargo run --release --bin textillab-pattern -- top chest=108 waist=89 hip=106 frontLength=48 backWaist=44 bustHeight=28 bustSpan=20 neck=39 armholeDepth=23 --out smoke-exports/bodice-v2.svg
      - name: v1.0 calibrated bodice CLI smoke test
        run: |
          cargo run --release --bin textillab-pattern -- top --fit loose --style coat --cap-ease 24 --torso-mm 20 --hip-mm 30 --hem-mm 40 --sleeve-mm 25 --out smoke-exports/textillab-v1.svg
          cargo run --release --bin textillab-pattern -- top --style sleeveless --out smoke-exports/textillab-v1-sleeveless.svg
      - name: Check v1.0 annotated pattern exports
        shell: bash
        run: |
          test -s smoke-exports/textillab-v1.svg
          test -s smoke-exports/textillab-v1-sleeveless.svg
          grep -q 'data-ruleset="textillab-experimental-1.0"' smoke-exports/textillab-v1.svg
          grep -q 'data-sleeves="0"' smoke-exports/textillab-v1-sleeveless.svg
          grep -q 'ÄL' smoke-exports/textillab-v1.svg
      - name: Check bodice features in SVG
        shell: bash
        run: |
          test -s smoke-exports/bodice-v2.svg
          grep -q 'data-bodice-version="2"' smoke-exports/bodice-v2.svg
          grep -q 'FDL' smoke-exports/bodice-v2.svg
          grep -q 'Taille' smoke-exports/bodice-v2.svg
      - name: Verify clothing SVG
        shell: bash
        run: |
          test -s smoke-exports/top-block.svg
          test -s smoke-exports/trousers-block.svg
          test -s smoke-exports/glove-block.svg
      - name: Verify OBJ exports
        shell: bash
        run: |
          test -s smoke-exports/obj-import.svg
          test -s smoke-exports/obj-split.svg
      - name: Verify exports
        shell: bash
        run: |
          test -s smoke-exports/pattern.svg
          test -s smoke-exports/pattern.obj
      - name: Upload exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textillab-exports-${{ matrix.os }}
          path: textillab/smoke-exports/
          if-no-files-found: ignore
